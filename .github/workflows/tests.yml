# Tests automatiques du carnet step, lancés par GitHub à chaque dépôt (onglet Actions).
# Coche verte = tout fonctionne. Croix rouge = ne pas installer cette version sur les tablettes.
name: Tests du carnet
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: index-old.html (ancien carnet) correspond bien à ses sources (ancien-carnet/)
        run: |
          python3 ancien-carnet/build.py
          git diff --exit-code index-old.html || (echo "index-old.html a été modifié à la main : modifier ancien-carnet/ puis lancer python3 ancien-carnet/build.py" && exit 1)
      - name: Installer Playwright
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Nouvelle appli · prof → tablette → prof (QR, fichiers, copie de secours, code oublié, reprise, anciens carnets)
        run: |
          python3 -m http.server 8830 >/dev/null 2>&1 &
          sleep 1
          node tests/flux.js
      - name: Nouvelle appli · démos élève et prof, affichage téléphone
        run: node tests/demo.js
      - name: Ancien carnet · saisie S1 à S8, mode prof, restauration
        run: node ancien-carnet/tests/e2e.js
      - name: Ancien carnet · mode démo
        run: node ancien-carnet/tests/demo.js
